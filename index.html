<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Fuchs · Apps</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2433;--muted:#5b6678;--line:#dfe3ea;--accent:#c46a00;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0a0e13;--fg:#dce6f0;--muted:#7d93a8;--line:#1a2330;--accent:#ffb020;--card:#0d1219}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:32px 20px 60px}
.kicker{font:700 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-size:28px;line-height:1.2;margin:8px 0 6px}
h2{font-size:18px;margin:28px 0 6px}
p,li{color:var(--fg)}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:16px 0}
a{color:var(--accent)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<div class="kicker">Apps</div>
<h1>Daniel Fuchs</h1>
<p class="muted">Small, offline tools for pilots.</p>
<div class="card"><b>E6B Aviation Computer</b><br><a href="e6b/support.html">Support</a> · <a href="e6b/privacy.html">Privacy Policy</a></div>
<footer>Daniel Fuchs · <a href="mailto:[EMAIL]">[EMAIL]</a> · <a href="/">All apps</a></footer>
</main>
</body>
</html>
